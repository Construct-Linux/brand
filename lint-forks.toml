"src/_sass/gnome-shell/widgets/_osd-42.scss space" = { why = "upstream's OSD: the window's 8, the level bar's 4, the pad OSD's 32 - not yet moved to the grid", values = ["8px", "4px", "32px"] }
"src/_sass/gnome-shell/widgets/_popovers-46.scss space" = { why = "upstream's popup menus: the content's 3/14 padding, the toggle switch's 4 and a label's 8 - not yet moved to the grid", values = ["0 3px 14px", "$margin-size", "$margin-size * 2"] }
"src/_sass/gnome-shell/widgets/_quick-settings-48.scss space" = { why = "quick settings: ours (7a83e6e5) centres a 16px icon on the 24px disc, 4 all round; upstream's (GNOME 48 port) menu button 6 by 10.5, icon buttons and icons 9, menu items 8, a menu's first item 10 from its edge - not yet moved to the grid", values = ["($medium-icon-size - $base-icon-size) / 2", "$space-size $space-size * 1.75", "$space-size * 1.5", "$space-size + 2px", "$space-size + $margin-size", "1.5 * $space-size"] }
"src/_sass/gnome-shell/widgets/_screen-shield.scss space" = { why = "the lock screen: upstream's clock 42 and hint 48 margins; ours (1a28535e) the parental-controls button 16 by 44, GNOME Shell 51's own", values = ["42px", "48px", "($margin-size * 4) ($margin-size * 11)"] }
"src/_sass/gnome-shell/widgets/_screenshot.scss shadow" = { why = "upstream's screenshot UI: the 24px white area handles' own small shadow, a mark over any picture rather than a surface", values = ["0 1px 3px 2px rgba(0,0,0,0.2)"] }
