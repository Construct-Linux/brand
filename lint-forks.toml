"src/_sass/gnome-shell/widgets/_switcher-popup.scss space" = { why = "upstream's Alt+Tab: 8 inside the popup and around items, 2 around thumbnails - not yet moved to the grid", values = ["8px", "2px"] }
"src/_sass/gnome-shell/widgets/_tiled-previews.scss radius" = { why = "upstream's tile preview: $material-radius + 1px (10) on its outer corners, over the 1px decoration edge", values = ["$tile_corner_radius 0 0 0", "0 $tile_corner_radius 0 0", "$tile_corner_radius $tile_corner_radius 0 0"] }
