# What lint.py reads in each fork, and the exceptions, each with its reason. A color the shell or
# an app's chrome draws is never an exception: it is one of palette.toml's, or white or black at an alpha.
[fork.Orchis-theme]
files = ["src/_sass/**/*.scss", "src/gnome-shell/**/*.svg", "src/gtk/assets.svg"]
[fork.Orchis-theme.skip]
"src/_sass/_construct-palette.scss" = "the palette itself: compared with palette/construct.scss instead (lint.py mirrors())"
"src/_sass/_color-palette-default.scss" = "named colors apps' styles use for content (sticky notes, weather); the shell must not reference them"
"src/_sass/gtk/_colors-libadwaita.scss" = "GNOME's named palette (@define-color blue_1...), API apps read"
"src/_sass/gtk/_colors-public.scss" = "elementary/Pantheon's public named colors, API apps read"
"src/_sass/gtk/apps/_libadwaita.scss" = "libadwaita's color-picker swatches: content, not chrome"
[fork.Orchis-theme.allow]
# The accent at an alpha or a shade that is not a token of the scale (lint.py C7). St draws one
# background and has no opacity, so the shell's solid primary has its states mixed into it.
[fork.Orchis-theme.accent]
"src/_sass/gnome-shell/widgets/_buttons.scss mix(on($primary" = "the shell's primary: on_accent at 8% and 16% over the solid fill for hover and press, and the insensitive label at half opacity, each mixed into one colour, as St draws one background and has no opacity"
"src/_sass/gnome-shell/widgets/_buttons.scss mix($primary" = "the shell's insensitive primary: the solid accent at half opacity over the raised surface, mixed into one colour for St"

[fork.dash-to-panel]
files = ["src/stylesheet.css"]
[fork.dash-to-panel.allow]

[fork.tilingshell]
files = ["src/styles/*.scss"]
[fork.tilingshell.skip]
"src/styles/prefs.scss" = "the preferences window is GTK, which Orchis draws; its own tints are previews"
[fork.tilingshell.allow]

[fork.Vitals]
files = ["stylesheet.css"]
[fork.Vitals.allow]
