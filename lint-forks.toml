"src/_sass/gnome-shell/widgets/_window-picker.scss radius" = { why = "GNOME Shell's own: workspace.js clips the workspace's wallpaper at BACKGROUND_CORNER_RADIUS_PIXELS, 30, and the card's CSS radius must be the same or the frame and the picture part at the corners (THEMING.md, Elevation)", values = ["30px"] }
