# What lint.py reads in each fork, and the exceptions, each with its reason. A color the shell or
# an app's chrome draws is never an exception: it is one of palette.toml's, or white or black at an alpha.
[fork.Orchis-theme]
files = ["src/_sass/**/*.scss", "src/gnome-shell/**/*.svg", "src/gtk/assets.svg"]
[fork.Orchis-theme.skip]
"src/_sass/_construct-palette.scss" = "the palette itself: compared with palette/construct.scss instead (lint.py mirrors())"
"src/_sass/_color-palette-default.scss" = "named colors apps' styles use for content (sticky notes, weather); the shell must not reference them"
"src/_sass/gtk/_colors-libadwaita.scss" = "GNOME's named palette (@define-color blue_1...), API apps read"
"src/_sass/gtk/_colors-public.scss" = "elementary/Pantheon's public named colors, API apps read"
"src/_sass/gtk/apps/_libadwaita.scss" = "libadwaita's color-picker swatches: content, not chrome"
[fork.Orchis-theme.allow]
# The accent at an alpha or a shade that is not a token of the scale (lint.py C7). St draws one
# background and has no opacity, so the shell's solid primary has its states mixed into it.
[fork.Orchis-theme.accent]
"src/_sass/gnome-shell/widgets/_buttons.scss mix(on($primary" = "the shell's primary: on_accent at 8% and 16% over the solid fill for hover and press, and the insensitive label at half opacity, each mixed into one colour, as St draws one background and has no opacity"
"src/_sass/gnome-shell/widgets/_buttons.scss mix($primary" = "the shell's insensitive primary: the solid accent at half opacity over the raised surface, mixed into one colour for St"
"src/_sass/gnome-shell/widgets/_calendar-44.scss rgba($primary, 0.02)" = "a focused calendar day's background, which no eye sees: St paints an inset box-shadow (the focus ring) only over a background, and a day has none; 0.02 as St keeps alpha in 8 bits and 0.01 is 0"
# G7 (lint.py): radii, spacing and shadows off THEMING.md's R1, SP1 and elevation table, per file and
# kind, each value listed so a new one fails. Most are upstream Orchis' metrics the GTK and shell
# passes have not moved yet; "a finding" marks one that should change rather than stay.
[fork.Orchis-theme.shape]
"src/_sass/gnome-shell/_drawing.scss space" = { why = "upstream's: the entry mixin's 2px margin, which with its 2px transparent border keeps the focused entry's 2px accent border from shifting the text; SP1 has no 2", values = ["2px 6px 6px"] }
"src/_sass/gnome-shell/_extensions-46-0.scss space" = { why = "upstream's dash-to-panel preview: its scroll view padded top and bottom by the menu's radius (15), as deep as the rounded corners it sits in", values = ["$dash_to_panel_menu_radius 0"] }
"src/_sass/gnome-shell/widgets/_app-grid-46.scss radius" = { why = "upstream's: the running dot's 2px, a mark a few px across, and the page indicator's 10px on a 10px dot - both discs, written as numbers rather than $circular-radius", values = ["2px", "10px"] }
"src/_sass/gnome-shell/widgets/_app-grid-46.scss space" = { why = "upstream's app grid metrics - the running dot's 1px, the folder dialog's $panel_height and 24/36 title box, the insensitive hint's 5x7, the folder grid's 30 - not yet moved to the grid", values = ["1px", "$panel_height", "24px 36px 0", "5px 7px", "30px"] }
"src/_sass/gnome-shell/widgets/_calendar-44.scss space" = { why = "upstream's: 2px around the month label, the pager and the change-month arrows, the week number's 2 + 6, the world clocks' and weather's 8/16 - not yet moved to the grid", values = ["2px", "0 2px", "0 $margin-size / 2 + $space-size", "8px", "16px"] }
"src/_sass/gnome-shell/widgets/_corner-ripple.scss radius" = { why = "upstream's hot-corner ripple: a quarter disc of the ripple's 50px plus 2, the decoration's own geometry, not a control or a surface", values = ["0 0 $ripple_size + 2px 0", "0 0 0 $ripple_size + 2px"] }
"src/_sass/gnome-shell/widgets/_dash-46.scss space" = { why = "upstream's dash: its padding is $dash_padding - $dash_spacing, the separator 4, the label's 9 - Shell's own dash metrics, not yet moved to the grid (dash-to-panel draws the dock in the image)", values = ["$dash_padding - $dash_spacing", "0 $dash_spacing", "$margin-size", "$space-size * 1.5"] }
"src/_sass/gnome-shell/widgets/_dialogs-47.scss space" = { why = "upstream's modal dialogs (GNOME Shell's own 16/32/40, 14 between title and body, 8/4/20 in the password prompt, 28 in the audio device chooser) - not yet moved to the grid", values = ["$margin-size * 4 40px $margin-size * 8", "32px", "0 16px", "14px", "8px", "4px", "20px", "28px"] }
"src/_sass/gnome-shell/widgets/_entries.scss space" = { why = "upstream's: the entry's 8px sides, 4 around caps-lock and peek-password icons, the hint text's 2 - not yet moved to the grid", values = ["0 8px", "0 4px", "2px"] }
"src/_sass/gnome-shell/widgets/_ibus-popup.scss space" = { why = "upstream's IBus candidate popup padding (3/10/13) and page buttons (4x8, 2) - not yet moved to the grid", values = ["($space-size / 2) 10px 13px", "4px 8px", "2px"] }
"src/_sass/gnome-shell/widgets/_keyboard.scss space" = { why = "upstream's on-screen keyboard: 4px between keys ($margin-size), Shell's key pitch", values = ["$margin-size"] }
"src/_sass/gnome-shell/widgets/_keyboard.scss shadow" = { why = "upstream's on-screen keyboard: each key's 1px cast edge, a mark on the key rather than a surface's depth", values = ["0 1px rgba($black, 0.2)"] }
"src/_sass/gnome-shell/widgets/_login-dialog.scss space" = { why = "the login and unlock prompt: ours (1a28535e) styles Shell 51's auth list and web-login prompt in Orchis' own $space-size and $margin-size multiples (32, 16, 9, 4, 1.8 by 12, 4.2 by 6, 8, 15 by 24, 24 by 8, 6 by 27); upstream's button 4 by 18, user widget 14/15/16 and warning 100 - not yet moved to the grid", values = ["4px 18px", "100px 0px", "2px", "15px", "14px", "$base-icon-size", "32px", "16px", "$space-size * 1.5", "$margin-size", "($space-size * 0.3) 2em", "($space-size * 0.7) $space-size", "$margin-size * 2", "($space-size * 2.5) ($space-size * 4)", "($margin-size * 6) ($margin-size * 2)", "$space-size ($space-size * 4.5)"] }
"src/_sass/gnome-shell/widgets/_looking-glass.scss space" = { why = "upstream's Looking Glass toolbar, 6 by 9: a developer tool", values = ["$space-size $space-size * 1.5"] }
