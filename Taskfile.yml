version: '3'

run: once  # shared deps (setup, generate, ...) run a single time per invocation

vars:
  VENV: .venv
  PYTHON: '{{.PYTHON | default ".venv/bin/python"}}'
  FRAMES_DIR: frames
  VIDEO: construct.mp4
  DURATION: 5
  SPRITE: sprite.png
  COLS: 8
  SIZE: 1080            # Plymouth frame width/height (>= 800; 1080 for a 1080p boot)
  QUALITY: 80-95        # pngquant quality range for the Plymouth PNGs
  PLY_DIR: plymouth

tasks:
  default:
    cmds:
      - task: all

  all:
    desc: Everything - video, sprite and compressed Plymouth frames
    deps: [encode, sprite, plymouth, logo]

  setup:
    desc: Create {{.VENV}} and install the Python dependencies
    sources: [requirements.txt]
    generates: ['{{.VENV}}/bin/python']
    cmds:
      - python3 -m venv {{.VENV}}
      - '{{.VENV}}/bin/pip install -q -r requirements.txt'

  font:
    desc: Install DejaVu Sans (the Plymouth default font) with the system package manager
    status:
      - test -n "$FONT" || ls /usr/share/fonts/*/DejaVuSans-Bold.ttf /usr/share/fonts/*/*/DejaVuSans-Bold.ttf ~/Library/Fonts/DejaVuSans-Bold.ttf /Library/Fonts/DejaVuSans-Bold.ttf 2>/dev/null | grep -q .
    cmds:
      - |
        if command -v apt-get >/dev/null; then sudo apt-get install -y fonts-dejavu-core
        elif command -v dnf >/dev/null; then sudo dnf install -y dejavu-sans-fonts
        elif command -v pacman >/dev/null; then sudo pacman -S --noconfirm ttf-dejavu
        elif command -v zypper >/dev/null; then sudo zypper install -y dejavu-fonts
        elif command -v brew >/dev/null; then brew install --cask font-dejavu
        else echo "install DejaVu Sans manually or set FONT=/path/DejaVuSans-Bold.ttf"; exit 1
        fi

  pngquant:
    desc: Install pngquant with the system package manager
    status:
      - command -v pngquant
    cmds:
      - |
        if command -v apt-get >/dev/null; then sudo apt-get install -y pngquant
        elif command -v dnf >/dev/null; then sudo dnf install -y pngquant
        elif command -v pacman >/dev/null; then sudo pacman -S --noconfirm pngquant
        elif command -v zypper >/dev/null; then sudo zypper install -y pngquant
        elif command -v brew >/dev/null; then brew install pngquant
        else echo "install pngquant manually"; exit 1
        fi

  deps:
    desc: Install everything (Python packages, font, pngquant)
    deps: [setup, font, pngquant]

  generate:
    desc: Render the 48 PNG frames into {{.FRAMES_DIR}}/
    deps: [deps]
    sources: [video.py]
    generates: ['{{.FRAMES_DIR}}/construct_*.png']
    cmds:
      - '{{.PYTHON}} video.py {{.FRAMES_DIR}}'

  encode:
    desc: Build {{.VIDEO}} ({{.DURATION}}s) from the frames
    deps: [generate]
    sources: ['{{.FRAMES_DIR}}/construct_*.png', encode.py]
    generates: ['{{.VIDEO}}']
    cmds:
      - '{{.PYTHON}} encode.py {{.FRAMES_DIR}} {{.VIDEO}} {{.DURATION}}'

  play:
    desc: Play {{.VIDEO}} in a loop (q / Esc to quit)
    deps: [encode]
    cmds:
      - '{{.PYTHON}} play.py {{.VIDEO}}'

  sprite:
    desc: Build {{.SPRITE}}, a grid of all frames to see the progression
    deps: [generate]
    sources: ['{{.FRAMES_DIR}}/construct_*.png', sprite.py]
    generates: ['{{.SPRITE}}']
    cmds:
      - '{{.PYTHON}} sprite.py {{.FRAMES_DIR}} {{.SPRITE}} {{.COLS}}'

  plymouth:
    desc: Transparent PNG per frame for Plymouth ({{.SIZE}}px, no background), compressed with pngquant, into {{.PLY_DIR}}/
    label: plymouth-{{.SIZE}}-{{.QUALITY}}  # re-run when SIZE or QUALITY change
    deps: [deps]
    sources: [video.py, plymouth.py]
    generates: ['{{.PLY_DIR}}/construct-*.png']
    cmds:
      - rm -rf {{.PLY_DIR}}
      - SIZE={{.SIZE}} {{.PYTHON}} video.py .plymouth-frames
      - '{{.PYTHON}} plymouth.py .plymouth-frames {{.PLY_DIR}} 0'  # lossless RGBA...
      - rm -rf .plymouth-frames
      - task: compress

  compress:
    desc: Compress the PNGs in {{.PLY_DIR}}/ in place with pngquant (replaces the files)
    deps: [pngquant]
    cmds:
      - pngquant --force --ext .png --strip --speed 1 --skip-if-larger --quality {{.QUALITY}} {{.PLY_DIR}}/*.png
      - du -sh {{.PLY_DIR}}

  logo:
    desc: Logo proposals (SVG color/mono, PNG icon sizes, preview.png) into logos/
    deps: [deps]
    sources: [logo.py]
    generates: [logos/preview.png]
    cmds:
      - '{{.PYTHON}} logo.py logos'

  clean:
    desc: Remove generated frames, video, sprite and Plymouth PNGs
    cmds:
      - rm -rf {{.FRAMES_DIR}} {{.VIDEO}} {{.SPRITE}} {{.PLY_DIR}} logos
