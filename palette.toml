# The colors of CONSTRUCT: the one place they are written. logo.py and wallpaper.py read them,
# and palette.py checks their contrast and writes them out (palette/) for the theme forks -
# Orchis (GTK and GNOME Shell), Tela (folders), Bibata (cursor) - for the apps GTK does not draw -
# Ghostty, VS Code - and for the image (palette.json). THEMING.md says where each one goes.
#
# Two modes. Dark is the default: the cyan of the logo on ink, the wallpaper's. The boot draws the
# same cyan on black. Light keeps the same hue, darkened until text in it reads on white.
# The neutrals carry the ink's blue (hue ~207), so the desktop, the boot and the logo are one
# surface, not cyan on a stock grey.

[brand]
cyan = "#00E5FF"        # the mark, the animation, the accent in dark mode
ink = "#0B1116"         # the wallpaper behind the mark, previews: the darkest surface the desktop shows
paper = "#F4F6F8"       # behind the mono mark: the lightest surface but white
boot = "#000000"        # the ground under all that is not a window or the desktop: firmware, Plymouth,
                        # GNOME's overview, lock and login ground

# Surfaces, Orchis' scale: a-d light (a is the brightest), e-h dark (e is the darkest).
# Orchis uses c and f as the window background (e is the desktop's: a window on it has no edge),
# a and g for views (lists, text) and the headerbar, b and f for alternating rows, d and h for
# raised surfaces (popovers, the shell's menus).
[neutral]
a = "#FFFFFF"
b = "#F9FAFB"
c = "#F4F6F8"
d = "#C9D1D8"
e = "#0B1116"
f = "#11181E"
g = "#172028"
h = "#1F2A33"

[dark]
accent = "#00E5FF"      # one color, seven levels (THEMING.md, "Accent: one scale"), strongest first:
                        # the brand mark; the one primary action per view, solid; indicators - a
                        # switch, a slider, progress, a badge, the caret - mark-sized; the 2px focus
                        # ring, and nothing else rings. Selected and on take a tint, links and
                        # today accent_text, transient overlays the decoration tint.
accent_text = "#00E5FF" # the accent standing alone: labels and icons on a tint, links
on_accent = "#0B1116"   # text on the accent
text = "#E6EDF2"
muted = "#9FB3C0"
border = "#2A3843"
success = "#3DDC97"
warning = "#FFC857"
error = "#E8789B"       # leans pink, so deutans still tell it from success (ΔE00 10.6)

[light]
accent = "#007A85"
accent_text = "#00646D" # #007A85 is 4.25:1 on its own 10% tint; this is >= 4.5 on every tint
on_accent = "#FFFFFF"
text = "#11181E"
muted = "#536672"       # dark enough for the shelf (5.08:1) and the desk (4.66:1)
border = "#C9D1D8"      # the solid twin of line.light.border over a, for what cannot draw an alpha
                        # (VS Code, Ghostty's splits)
success = "#226D46"     # darker than the accent: at one lightness teal and green are one color to
                        # tritans; this is ΔE00 7.7 from the accent for them
warning = "#8F5B00"
error = "#BE364E"
desk = "#DEE4E8"        # the light desktop and the wallpaper's ground: d at 50% over c, so a c window
                        # stands on something (1.18:1); on paper it would stand on itself
shelf = "#E9EDF0"       # the light sidebar pane: d at 25% over c, a step below the window, as
                        # libadwaita's sidebar is

# The accent over a surface, for what is selected or on and larger than a mark (quick toggles,
# the selected day, rows, tabs): an alpha, not a color, so one table serves every surface. The
# label and icon on a tint are accent_text; muted text never goes on one. The primary action is
# not a tint: it is the solid accent, so it never looks selected.
[tint.dark]
rest = 0.18       # keeps an on quick toggle ΔE00 6.5 from an off one for deutans on IPS
hover = 0.23
active = 0.28     # the ceiling: at 0.32 over h accent_text falls to 4.29
selection = 0.25
decoration = 0.08 # transient overlays only (rubberband, tile preview, a drop target), with a 1px
                  # accent edge; never a resting surface, a pane, a banner or a control
track = 0.50      # a switch's track when on; the knob is the full accent and carries the state

[tint.light]
rest = 0.10
hover = 0.17      # each step ΔE00 3.6 or more as drawn, 2.2 for protans on IPS, and #00646D
active = 0.24     # still 4.57:1 on the active tint
selection = 0.20
decoration = 0.05
track = 0.50

# The light lines: light.muted at an alpha over whatever surface, so every line keeps the ink's
# hue (OKLCH h 236, C 0.010-0.015). GNOME's black at 0.12 has no hue (C 0.001), which is most of
# why a light window read as stock. Dark draws one solid line, dark.border.
[line.light]
divider = 0.20    # separators inside a card or a list
border = 0.30     # card and list outlines, the headerbar's rule, pane separators, popovers, entries
ring = 0.40       # a window's outer ring on the desk

# libadwaita's steps, so the shell and the apps match; a container takes its child's radius plus
# its padding (THEMING.md).
[shape]
radius_control = 9   # buttons, entries, menu items, rows, tooltips
radius_surface = 15  # windows, popovers, the shell's menus, banners, the dock
radius_sheet = 24    # the date menu, modal dialogs, app tiles
space = [3, 6, 12, 18, 24]
inset = 6            # both bars from the screen edge

# Tela: the folder body; its glyph is drawn in folder_glyph. Folders sit on both modes, so the
# color is between the two accents.
[icons]
folder = "#0097A7"
folder_glyph = "#FFFFFF"

# Bibata: the three colors its SVGs are drawn with (render.json's #00FF00, #0000FF, #FF0000).
[cursor]
fill = "#0B1116"
outline = "#FFFFFF"
watch = "#00E5FF"

# libadwaita apps on GNOME 47+ take the accent from a fixed list; this is the nearest to cyan,
# used where the theme cannot reach.
[gnome]
accent = "teal"

# Type. Audiowide is only the wordmark: it is a display face, not one to read menus in.
[type]
wordmark = "Audiowide"
ui = "Adwaita Sans"         # GNOME's own since 48, regular weight; the image sets no other
mono = "Adwaita Mono"       # GNOME's monospaced, in apps' code and text editors
terminal = "JetBrains Mono" # the terminal only: Ghostty's own, at 11 pt and without ligatures

# The terminal's sixteen colors (Ghostty; VS Code's terminal), on the view surface: g in dark, a
# in light. Red, green, yellow and cyan are the semantic colors and the accent, black and white
# the neutrals, bright black the muted text; only blue, magenta and the brights are written
# here. Blue sits on the ink's hue; magenta opposite the success green, greyed until protans and
# deutans tell it from blue (ΔE00 10); the brights keep each hue, lighter in dark and darker in
# light, where lighter would not read on white.
[ansi.dark]
blue = "#5DB2F7"
magenta = "#B38AC0"
bright_red = "#FF9BAB"
bright_green = "#7CEEB4"
bright_yellow = "#FFDE8C"
bright_blue = "#82C8FF"
bright_magenta = "#DCACF2"
bright_cyan = "#82F3FF"

[ansi.light]
blue = "#0060B4"       # ΔE00 7.8 from the light accent for tritans
magenta = "#7A2776"
bright_red = "#B10029"
bright_green = "#006C38"
bright_yellow = "#7C4500"
bright_blue = "#00539B"
bright_magenta = "#732091"
bright_cyan = "#006773"
